[project]
authors = [{name = "Cameron Brooks ", email = "brooksc3@oregonstate.edu"}]
dependencies = ["soundfile>=0.13.1,<0.14", "coremltools>=9.0,<10", "torch>=2.10.0,<3", "pyobjc-framework-coreml>=12.1,<13", "soxr>=1.0.0,<2", "matplotlib>=3.10.8,<4"]
name = "emagic"
requires-python = ">= 3.12, < 3.14"
version = "1.3.0"

[project.scripts]
emagic = "coreml.cli:main"
pymagic = "pytorch.pymagic:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["coreml", "pytorch"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
emagic = { path = ".", editable = true }

[tool.pixi.activation.env]
KMP_DUPLICATE_LIB_OK = "TRUE"

[tool.pixi.tasks]
emagic = { cmd = "emagic", description = "Run emagic stem separator" }

[tool.pixi.dependencies]
python = "3.12.*"
numpy = ">=2.4.1,<3"
